    <!-- Apply the saved appearance (Light / Dark / System) before first paint — no flash of the wrong theme.
         Keep the key and colors in sync with src/lib/theme.ts. -->
    <script>
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("pfw-theme") || "system";
        } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.add(dark ? "dark" : "light");
        root.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0F172A" : "#F1F5F9");
        // Installed iOS web app: translucent (white-text) status bar in Dark, solid default bar in Light.
        var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
        document
          .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          .setAttribute("content", dark ? "black-translucent" : "default");
        if (standalone && !dark) root.classList.add("fw-sb-solid");
      })();
    </script>
